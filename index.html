<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INSTITION INVOICE SEARCH</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 2000px;
            width: 100%;
        }

        /* --- HEADER SECTION STYLES --- */
        .header-section {
            display: block; 
            margin-bottom: 30px; 
            padding-left: 10px; 
            padding-right: 10px;
        }
        .header-title {
            text-align: center;
            flex-grow: 1;
            display: flex;
            align-items: center; 
            justify-content: center;
            gap: 15px; 
            margin-bottom: 20px;
        }
        .header-title img {
            height: 70px; 
            max-width: 150px;
            flex-shrink: 0;
        }
        .header-title h1 {
            color: #2c3e50; 
            margin: 0;
            font-size: 24px;
            font-weight: 700; 
            line-height: 1;
        }
        .header-title h5 {
            margin: 0;
            font-size: 24px;
            font-weight: 700;
            line-height: 1;
            color: #2c3e50;
        }
        .header-title p {
            color: #2c3e50; 
            margin: 5px 0 0;
            font-size: 14px;
            line-height: 1.2;
        }
        .header-text-container div {
            text-align: left;
        }

        
        /* --- Upload & Print Section Style --- */
        .upload-section {
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            border: 1px dashed #3498db;
            display: flex;
            justify-content: flex-start; 
            align-items: center;
            gap: 15px;
        }
        .upload-section input[type="file"] {
            border: 1px solid #bdc3c7;
            padding: 8px;
            border-radius: 5px;
            background-color: white;
            max-width: 300px; 
        }
        .upload-section button {
            background-color: #2ecc71;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 700;
            transition: background-color 0.3s;
        }
        .upload-section button#printButton {
            background-color: #3498db; 
        }
        .upload-section button:hover {
            background-color: #27ae60;
        }
        .upload-section button#printButton:hover {
            background-color: #2980b9;
        }

        /* --- Filter Panel Style --- */
        .filter-toggle-btn {
            display: none;
            width: 100%;
            background-color: #34495e;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            margin-bottom: 12px;
            cursor: pointer;
            min-height: 44px;
        }
        .filter-panel {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 12px;
            background-color: #ecf0f1;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .filter-item {
            display: flex;
            flex-direction: column;
        }
        .filter-item label {
            font-size: 0.75rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 4px;
        }
        .filter-clear-item {
            justify-content: flex-end;
        }
        #clearFiltersButton {
            background-color: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 700;
            min-height: 40px;
            width: 100%;
            transition: background-color 0.3s;
        }
        #clearFiltersButton:hover {
            background-color: #c0392b;
        }

        /* --- Table Styles (No Change) --- */
        .table-wrapper {
            overflow-x: auto;
            overflow-y: auto;
            max-height: 80vh;
            margin-top: 20px;
            border-radius: 10px;
            box-shadow: inset 0 0 5px rgba(0, 0, 0, 0.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            table-layout: auto; 
            min-width: 1500px; 
        }
        th, td {
            border: 1px solid #e0e0e0;
            padding: 12px 15px;
            text-align: left;
            font-size: 0.9rem;
            color: #333;
            white-space: nowrap; 
        }
        th:nth-child(1), td:nth-child(1) { 
            min-width: 60px; 
            width: 60px; 
            text-align: center; 
        } 
        th:nth-child(4), td:nth-child(4) { 
            min-width: 150px; 
            width: 150px;
        }
        thead {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: #3498db;
        }
        th {
            background-color: #3498db;
            color: #ffffff;
            font-weight: 700;
            height: auto;
            vertical-align: top;
        }
        .th-content {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: space-between;
            height: 100%;
        }
        th span.header-text {
            margin-bottom: 5px;
            white-space: nowrap;
        }
        tr:nth-child(even) {
            background-color: #f8f8f8;
        }
        tr:hover {
            background-color: #f1f1f1;
        }
        tr.highlight-ok {
            background-color: #e6ffe6; 
            font-weight: 500;
        }
        tr.highlight-ok:hover {
            background-color: #d9f2d9;
        }
        .highlight-invoice-duplicate {
            background-color: #fffacd; 
            font-weight: bold;
        }
        .loading-message {
            text-align: center;
            padding: 20px;
            font-size: 1.1rem;
            color: #555;
        }
        .filter-input, .filter-dropdown {
            width: 100%; 
            padding: 8px; 
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
            color: #333;
            background-color: #fff;
            font-size: 0.9rem;
        }
        .editable-cell select {
            background-color: #ecf0f1;
            cursor: pointer;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            padding: 8px;
            width: 100%;
            box-sizing: border-box;
            font-size: 0.9rem;
        }
        .tick-mark {
            font-size: 1.2em;
            color: green;
            font-weight: bold;
        }

        /* --- Print View Specific Styles (Used inside the new tab) --- */
        .print-view-body {
            font-family: 'Inter', sans-serif;
            margin: 10px;
        }
        /* প্রিন্ট হেডারের জন্য ডিফল্ট স্টাইল */
        .print-view-header {
            display: flex;
            align-items: flex-start;
            justify-content: center; 
            gap: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        .print-view-header > div {
            text-align: center !important;
        }
        .print-view-header img {
            height: 50px; 
        }
        .print-view-header h1 {
            font-size: 16pt;
            margin: 0;
            font-weight: 700;
        }
        .print-view-header p {
            font-size: 10pt;
            margin: 2px 0 0;
        }
        .print-view-table {
            width: 100%;
            border-collapse: collapse;
        }
        .print-view-table th, .print-view-table td {
            border: 1px solid #000;
            /* প্রিন্ট করার সময় কলাম ফিট করার জন্য প্যাডিং এবং ফন্ট সাইজ কমানো হয়েছে */
            padding: 3px 5px; /* প্যাডিং আরও কমানো হয়েছে */
            text-align: left;
            font-size: 7.5pt; /* ফন্ট সাইজ আরও কমানো হয়েছে */
            white-space: normal;
        }
        .print-view-table thead th {
            background-color: #3498db;
            color: #ffffff;
            -webkit-print-color-adjust: exact; 
            color-adjust: exact; 
        }
        .print-view-table tr:nth-child(even) {
            background-color: #f8f8f8;
            -webkit-print-color-adjust: exact; 
            color-adjust: exact; 
        }
        .print-view-table tr.highlight-ok {
            background-color: #e6ffe6 !important; 
            -webkit-print-color-adjust: exact; 
            color-adjust: exact; 
        }
        .print-view-table .highlight-invoice-duplicate {
            background-color: #fffacd !important; 
            font-weight: bold;
            -webkit-print-color-adjust: exact; 
            color-adjust: exact; 
        }
        .print-view-table .tick-mark {
            font-size: 1.1em;
            color: green;
            font-weight: bold;
            text-align: center;
            display: block;
        }

        @media print {
            /* ⭐ গুরুত্বপূর্ণ: টেবিল হেডার রিপিট করার জন্য স্ট্যান্ডার্ড CSS */
            .print-view-table thead {
                display: table-header-group; 
                position: sticky;
                top: 0;
            }
            
            @page {
                size: A4 landscape; 
                /* ⭐ পরিবর্তন ১: মার্জিন বাড়ানো হলো (উপরে ও নিচে) */
                margin: 15mm; 
            }
            
            /* হেডার সেকশনটি শুধুমাত্র প্রথম পেজেই থাকবে, দ্বিতীয় পেজ থেকে শুধু টেবিলের কলামের নাম রিপিট হবে */
            .print-header-container {
                page-break-after: avoid; 
                /* ⭐ পরিবর্তন ২: হেডারের নিচে মার্জিন বাড়ানো হলো */
                margin-bottom: 20px; 
            }
            
            .table-and-header-wrapper tr {
                page-break-inside: avoid;
                page-break-after: auto;
            }

        }
        
        /* --- Responsive Styles (Mobile-friendly card view) --- */
        @media screen and (max-width: 768px) {
            body { padding: 8px; }
            .container { padding: 12px; border-radius: 10px; box-shadow: none; }
            .header-section {
                flex-direction: column; 
                align-items: center;
                padding-left: 0;
                padding-right: 0;
            }
            .header-title {
                flex-direction: column;
                gap: 6px;
            }
            .header-title img { 
                height: 55px; 
                margin-right: 0;
                margin-bottom: 8px;
            }
            .header-title h1 { font-size: 18px; }
            .header-title p { font-size: 12px; }
            .header-title h1, .header-title p {
                text-align: center;
            }
            .upload-section { 
                justify-content: center;
                flex-direction: column;
                align-items: stretch;
            }
            .upload-section input[type="file"] {
                max-width: 100%;
                width: 100%;
                box-sizing: border-box;
                min-height: 44px;
            }
            .upload-section button {
                width: 100%;
                min-height: 44px;
                font-size: 0.95rem;
            }

            /* ফিল্টার প্যানেল ডিফল্টে লুকানো, বাটনে ট্যাপ করলে দেখাবে */
            .filter-toggle-btn { display: block; }
            .filter-panel {
                display: none;
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
                padding: 12px;
            }
            .filter-panel.open { display: grid; }
            .filter-input, .filter-dropdown {
                min-height: 42px;
                font-size: 0.9rem;
                padding: 8px;
            }
            .filter-clear-item { grid-column: 1 / -1; }

            /* --- টেবিলকে কার্ড ভিউতে রূপান্তর --- */
            .table-wrapper {
                max-height: none;
                overflow: visible;
                box-shadow: none;
                margin-top: 10px;
            }
            table { min-width: 0; width: 100%; }
            thead { display: none; }
            tbody, tr, td { display: block; width: 100%; }
            tr {
                margin-bottom: 14px;
                border: 1px solid #e0e0e0;
                border-radius: 10px;
                padding: 10px 14px;
                box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
                background-color: #ffffff !important;
            }
            tr.highlight-ok { background-color: #e6ffe6 !important; }
            tr:hover { background-color: inherit; }
            td {
                border: none;
                border-bottom: 1px solid #f0f0f0;
                padding: 9px 0;
                white-space: normal;
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: 10px;
                font-size: 0.88rem;
                min-width: 0 !important;
                width: 100% !important;
                text-align: right;
            }
            td:last-child { border-bottom: none; }
            td::before {
                content: attr(data-label);
                font-weight: 700;
                color: #2c3e50;
                flex-shrink: 0;
                text-align: left;
            }
            td.highlight-invoice-duplicate {
                background-color: #fffacd !important;
                border-radius: 6px;
                padding-left: 6px;
                padding-right: 6px;
            }
            .editable-cell select { min-height: 40px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header-section">
            <div class="header-title">
                <img src="https://ibnsinasylhet.reviewyoursite.co.uk/wp-content/uploads/2020/06/logo.png" alt="IBN SINA Logo" style="height: 70px;">
                <div>
                    <br><br>
                    <h1>The IBN SINA Pharmaceutical Industry PLC</h1>
                    <p>DINAJPUR DEPOT</p>
                    <p>RECEVED INVOICE CHECK</p>
                </div>
            </div>
        </div>
        
        <div id="statusMessage" class="mt-4 p-3 rounded-lg text-center font-semibold transition-all duration-300" style="display:none;"></div>

        <div class="upload-section">
            <input type="file" id="csvFile" accept=".csv" />
            <button onclick="handleFileUpload()" id="uploadButton">CSV আপলোড করুন</button>
            <button onclick="printTable()" id="printButton">প্রিন্ট ডেটা</button> 
        </div>

        <button type="button" id="filterToggleButton" class="filter-toggle-btn" onclick="toggleFilterPanel()">
            <span id="filterToggleIcon">▼</span> ফিল্টার দেখান/লুকান
        </button>

        <div class="filter-panel" id="filterPanel">
            <div class="filter-item">
                <label>DA ID/Name</label>
                <input type="text" class="filter-input" placeholder="Filter DA ID/Name" data-column="0" onclick="this.select()">
            </div>
            <div class="filter-item">
                <label>Invoice No</label>
                <input type="text" class="filter-input" placeholder="Filter Invoice No" data-column="7" inputmode="numeric" onclick="this.select()">
            </div>
            <div class="filter-item">
                <label>STATUS</label>
                <select class="filter-dropdown" id="statusFilter" data-column="10">
                    <option value="">All Status</option>
                </select>
            </div>
            <div class="filter-item">
                <label>Client ID/Name</label>
                <input type="text" class="filter-input" placeholder="Filter Client ID/Name" data-column="2" onclick="this.select()">
            </div>
            <div class="filter-item">
                <label>Date</label>
                <input type="text" class="filter-input" placeholder="Filter Date" data-column="4" onclick="this.select()">
            </div>
            <div class="filter-item">
                <label>Category Name</label>
                <select class="filter-dropdown" id="categoryFilter" data-column="5">
                    <option value="">All Categories</option>
                </select>
            </div>
            <div class="filter-item">
                <label>Total Amount</label>
                <input type="text" class="filter-input" placeholder="Filter Amount" data-column="8" onclick="this.select()">
            </div>
            <div class="filter-item">
                <label>Total OS</label>
                <input type="text" class="filter-input" placeholder="Filter OS" data-column="9" onclick="this.select()">
            </div>
            <div class="filter-item">
                <label>Allocation ID</label>
                <input type="text" class="filter-input" placeholder="Filter Allocation ID" data-column="6" onclick="this.select()">
            </div>
            <div class="filter-item">
                <label>Rep ID/Name</label>
                <input type="text" class="filter-input" placeholder="Filter Rep ID/Name" data-column="1" onclick="this.select()">
            </div>
            <div class="filter-item">
                <label>Payment Mode</label>
                <input type="text" class="filter-input" placeholder="Filter Payment Mode" data-column="3" onclick="this.select()">
            </div>
            <div class="filter-item filter-clear-item">
                <button type="button" id="clearFiltersButton" onclick="clearAllFilters()">ফিল্টার মুছুন</button>
            </div>
        </div>
        
        <div id="loading" class="loading-message">ডেটা লোড হচ্ছে...</div>
        <div class="table-wrapper">
            <table id="invoiceDataTable" style="display:none;">
                <thead>
                    <tr>
                        <th><span class="header-text">Serial No</span></th>
                        <th><span class="header-text">DA ID/Name</span></th>
                        <th><span class="header-text">Invoice No</span></th>
                        <th><span class="header-text">STATUS</span></th>
                        <th><span class="header-text">Client ID/Name</span></th>
                        <th><span class="header-text">Date</span></th>
                        <th><span class="header-text">Category Name</span></th>
                        <th><span class="header-text">Total Amount</span></th>
                        <th><span class="header-text">Total OS</span></th>
                        <th><span class="header-text">Allocation ID</span></th>
                        <th><span class="header-text">Rep ID/Name</span></th>
                        <th><span class="header-text">Payment Mode</span></th>
                    </tr>
                </thead>
                <tbody>
                    </tbody>
            </table>
        </div>

        <script>
            let originalData = [];
            const statusEditableOptions = ['OK', ''];

            // --- FIREBASE REALTIME DATABASE কনফিগারেশন ---
            const FIREBASE_BASE_URL = 'https://invoice-check-dpr-default-rtdb.asia-southeast1.firebasedatabase.app';
            // ডেটা রুট পাথেই সেভ হবে (আলাদা কোনো সাব-নোড ছাড়া)
            function firebaseUrl(path) {
                return `${FIREBASE_BASE_URL}/${path}.json`;
            }
            // প্রতিটি row array-index (0-10) এর সাথে Firebase-এ ব্যবহৃত ফিল্ড নামের ম্যাপিং
            const columnFields = ['daId', 'repId', 'clientId', 'paymentMode', 'date', 'category', 'allocationId', 'invoiceNo', 'totalAmount', 'totalOS', 'status'];

            function rowObjectToArray(obj) {
                obj = obj || {};
                return columnFields.map(f => (obj[f] !== undefined && obj[f] !== null) ? obj[f] : '');
            }

            function arrayToRowObject(arr) {
                const obj = {};
                columnFields.forEach((f, i) => { obj[f] = arr[i] !== undefined ? arr[i] : ''; });
                return obj;
            }

            function generateLocalKey() {
                return Date.now().toString(36) + '_' + Math.random().toString(36).substr(2, 9);
            }

            // Firebase key-তে ব্যবহার করা যায় না এমন ক্যারেক্টার ('.', '#', '$', '[', ']', '/') সরিয়ে দেয়
            function sanitizeFirebaseKeySegment(str) {
                return String(str || '').trim().replace(/[.#$\[\]\/]/g, '-');
            }

            // key ফরম্যাট: "Invoice No_Client ID/Name" — একই Invoice No + একই Client হলে ওভাররাইট হবে
            function generateRowKey(rowArr) {
                const invoiceNo = sanitizeFirebaseKeySegment(rowArr[7]);   // কলাম index 7 = Invoice No
                const clientIdName = sanitizeFirebaseKeySegment(rowArr[2]); // কলাম index 2 = Client ID/Name
                if (invoiceNo && clientIdName) {
                    return `${invoiceNo}_${clientIdName}`;
                }
                // Invoice No বা Client ID/Name খালি থাকলে র‍্যান্ডম key ব্যবহার হবে, যাতে ডেটা হারিয়ে না যায়
                return generateLocalKey();
            }
            // মোবাইল কার্ড-ভিউতে প্রতিটি সেলের উপরে লেবেল দেখানোর জন্য
            const headerLabelsMap = {
                0: 'DA ID/Name', 1: 'Rep ID/Name', 2: 'Client ID/Name', 3: 'Payment Mode',
                4: 'Date', 5: 'Category Name', 6: 'Allocation ID', 7: 'Invoice No',
                8: 'Total Amount', 9: 'Total OS', 10: 'STATUS'
            };
            // --- কলাম ম্যাপিং (ডেটা অ্যারে ইন্ডেক্স অনুযায়ী) ---
            const printColumnsMap = {
                'Serial No': 'SERIAL', // বিশেষ কলাম
                'DA ID/Name': 0, 
                'Invoice No': 7,
                'STATUS': 10,
                'Client ID/Name': 2,
                'Date': 4,
                'Total OS': 9,
            };
            // ---------------------------------------------------


            // --- CSV Upload Functions (Firebase Realtime Database) ---
            function parseCSVLine(line) {
                const result = [];
                let cur = '';
                let inQuotes = false;
                for (let i = 0; i < line.length; i++) {
                    const char = line[i];
                    if (char === '"') {
                        if (inQuotes && line[i + 1] === '"') { cur += '"'; i++; }
                        else { inQuotes = !inQuotes; }
                    } else if (char === ',' && !inQuotes) {
                        result.push(cur); cur = '';
                    } else {
                        cur += char;
                    }
                }
                result.push(cur);
                return result.map(v => v.trim());
            }

            function parseCSV(csvContent) {
                const lines = csvContent.split(/\r\n|\n|\r/).filter(l => l.trim() !== '');
                if (lines.length === 0) return [];
                // প্রথম লাইনটি হেডার ধরে বাদ দেওয়া হচ্ছে
                const dataLines = lines.slice(1);
                return dataLines.map(line => parseCSVLine(line));
            }

            async function addRowsToFirebase(rows) {
                const updates = {};
                rows.forEach(rowArr => {
                    const key = generateRowKey(rowArr);
                    updates[key] = arrayToRowObject(rowArr);
                });
                const response = await fetch(firebaseUrl(''), {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updates)
                });
                if (!response.ok) {
                    throw new Error('Firebase write failed: HTTP ' + response.status);
                }
                return Object.keys(updates).length;
            }

            const MONTH_NAME_MAP = {
                'JAN': 0, 'FEB': 1, 'MAR': 2, 'APR': 3, 'MAY': 4, 'JUN': 5,
                'JUL': 6, 'AUG': 7, 'SEP': 8, 'OCT': 9, 'NOV': 10, 'DEC': 11
            };
            const MONTH_NAMES_SHORT = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

            // বিভিন্ন সোর্স (CSV, Firebase, ম্যানুয়াল এন্ট্রি) থেকে আসা ভিন্ন ভিন্ন ফরম্যাটের ডেট স্ট্রিং/সংখ্যা পার্স করে
            function parseDateString(dateValue) {
                if (dateValue === null || dateValue === undefined || dateValue === '') {
                    return null;
                }
                if (dateValue instanceof Date) {
                    return isNaN(dateValue.getTime()) ? null : dateValue;
                }

                const rawStr = String(dateValue).trim();
                if (!rawStr) return null;

                // Excel সিরিয়াল ডেট নম্বর (যেমন 45678) — CSV এক্সপোর্টে মাঝে মাঝে দেখা যায়
                if (/^\d+(\.\d+)?$/.test(rawStr)) {
                    const serial = parseFloat(rawStr);
                    if (serial > 20000 && serial < 90000) {
                        const excelEpoch = Date.UTC(1899, 11, 30);
                        const d = new Date(excelEpoch + serial * 86400000);
                        if (!isNaN(d.getTime())) return d;
                    }
                }

                const dateStr = rawStr.toUpperCase();

                // DD-MON-YYYY / DD MON YYYY / DD.MON.YYYY (যেমন 01-JAN-24, 1 Jan 2024)
                let m = dateStr.match(/^(\d{1,2})[\-\/\.\s]+([A-Z]{3,})[\-\/\.\s]+(\d{2,4})$/);
                if (m) {
                    const day = parseInt(m[1], 10);
                    const month = MONTH_NAME_MAP[m[2].substring(0, 3)];
                    let year = parseInt(m[3], 10);
                    if (month !== undefined && !isNaN(day) && !isNaN(year)) {
                        if (year < 100) year += (year > 50) ? 1900 : 2000;
                        const d = new Date(year, month, day);
                        if (d.getDate() === day && d.getMonth() === month && d.getFullYear() === year) return d;
                    }
                }

                // YYYY-MM-DD / YYYY/MM/DD (ISO স্টাইল, সময় থাকলেও ঠিক আছে)
                m = dateStr.match(/^(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})/);
                if (m) {
                    const year = parseInt(m[1], 10);
                    const month = parseInt(m[2], 10) - 1;
                    const day = parseInt(m[3], 10);
                    const d = new Date(year, month, day);
                    if (d.getFullYear() === year && d.getMonth() === month && d.getDate() === day) return d;
                }

                // DD-MM-YYYY / DD/MM/YYYY (সংখ্যায় লেখা তারিখ)
                m = dateStr.match(/^(\d{1,2})[\-\/](\d{1,2})[\-\/](\d{2,4})$/);
                if (m) {
                    let day = parseInt(m[1], 10);
                    let month = parseInt(m[2], 10) - 1;
                    let year = parseInt(m[3], 10);
                    if (year < 100) year += (year > 50) ? 1900 : 2000;
                    // মাসের ঘরে ১২-এর বেশি সংখ্যা থাকলে (MM-DD-YYYY ফরম্যাট ধরে নিয়ে) দিন/মাস অদল-বদল করে দেখা হয়
                    if (month > 11 && day <= 12) {
                        const tmp = day; day = month + 1; month = tmp - 1;
                    }
                    const d = new Date(year, month, day);
                    if (!isNaN(d.getTime()) && d.getMonth() === month && d.getDate() === day) return d;
                }

                // সবশেষে ব্রাউজারের নেটিভ পার্সার দিয়ে চেষ্টা (যেমন "Jan 1, 2024", পূর্ণ ISO টাইমস্ট্যাম্প ইত্যাদি)
                const nativeParsed = new Date(rawStr);
                if (!isNaN(nativeParsed.getTime())) {
                    return nativeParsed;
                }

                return null;
            }

            // পার্স করা Date-কে সবসময় একই, পড়া-সহজ ফরম্যাটে (DD-MON-YYYY) দেখানোর জন্য
            function formatDateForDisplay(date) {
                const day = String(date.getDate()).padStart(2, '0');
                const month = MONTH_NAMES_SHORT[date.getMonth()];
                const year = date.getFullYear();
                return `${day}-${month}-${year}`;
            }

            function customSort(a, b) {
                const rowA = a.data;
                const rowB = b.data;
                const statusA = String(rowA[10] || '').trim().toLowerCase();
                const statusB = String(rowB[10] || '').trim().toLowerCase();
                const isA_OK = statusA === 'ok';
                const isB_OK = statusB === 'ok';
                if (isA_OK && !isB_OK) { return 1; }
                if (!isA_OK && isB_OK) { return -1; }
                const dateA = parseDateString(rowA[4]); 
                const dateB = parseDateString(rowB[4]);
                if (dateA && dateB) {
                    return dateB.getTime() - dateA.getTime();
                } else if (dateA) {
                    return -1;
                } else if (dateB) {
                    return 1;
                }
                return 0;
            }

            function buildStatusSelect(cellData, originalRowIndex, originalColIndex) {

            function renderTableBody(dataToRender) {
                const tableBody = document.getElementById('invoiceDataTable').getElementsByTagName('tbody')[0];
                const loadingMessage = document.getElementById('loading');
                const dataTable = document.getElementById('invoiceDataTable');
                tableBody.innerHTML = '';

                if (!dataToRender || dataToRender.length === 0) {
                    const row = tableBody.insertRow();
                    const cell = row.insertCell();
                    cell.colSpan = 12;
                    cell.textContent = 'কোনো ডেটা পাওয়া যায়নি।';
                    cell.style.textAlign = 'center';
                    loadingMessage.style.display = 'none';
                    dataTable.style.display = 'table';
                    return;
                }

                const invoiceCounts = new Map();
                dataToRender.forEach(item => {
                    const invoiceNo = String(item.data[7] || '').trim(); 
                    if (invoiceNo) { 
                        invoiceCounts.set(invoiceNo, (invoiceCounts.get(invoiceNo) || 0) + 1);
                    }
                });
                const duplicateInvoices = new Set();
                invoiceCounts.forEach((count, invoiceNo) => {
                    if (count > 1) {
                        duplicateInvoices.add(invoiceNo);
                    }
                });

                dataToRender.forEach((item, sortedIndex) => { 
                    const rowData = item.data;
                    const originalRowIndex = item.originalIndex; 
                    const row = tableBody.insertRow();
                    const serialNoCell = row.insertCell();
                    serialNoCell.textContent = sortedIndex + 1;
                    serialNoCell.setAttribute('data-label', 'Serial No');

                    const statusValue = String(rowData[10] || '').trim().toLowerCase();
                    if (statusValue === 'ok') {
                        row.classList.add('highlight-ok');
                    }
                    
                    const displayOrder = [0, 7, 10, 2, 4, 5, 8, 9, 6, 1, 3]; 

                    displayOrder.forEach(originalColIndex => {
                        const rawCellData = rowData[originalColIndex];
                        const cellData = rawCellData !== undefined && rawCellData !== null ? String(rawCellData) : '';
                        const cell = row.insertCell();
                        cell.setAttribute('data-label', headerLabelsMap[originalColIndex] || '');
                        
                        if (originalColIndex === 7 && duplicateInvoices.has(cellData.trim())) {
                            cell.classList.add('highlight-invoice-duplicate');
                        }

                        if (originalColIndex === 10) { 
                            const trimmedLowercasedCellData = cellData.trim().toLowerCase();

                            if (trimmedLowercasedCellData === 'ok') {
                                cell.innerHTML = '<span class="tick-mark">✓</span>';
                                cell.classList.add('status-ok-cell');
                                cell.title = 'পরিবর্তন করতে ডাবল-ক্লিক করুন';
                                cell.addEventListener('dblclick', function() {
                                    alert('STATUS এডিট মোড চালু হয়েছে। নতুন স্ট্যাটাস নির্বাচন করুন।');
                                    cell.innerHTML = '';
                                    cell.classList.remove('status-ok-cell');
                                    cell.classList.add('editable-cell');
                                    cell.appendChild(buildStatusSelect(cellData, originalRowIndex, originalColIndex));
                                });
                            }
                            else {
                                cell.classList.add('editable-cell');
                                cell.appendChild(buildStatusSelect(cellData, originalRowIndex, originalColIndex));
                            }
                        }
                        else if (originalColIndex === 4) {
                            // Date কলাম: ভিন্ন ভিন্ন সোর্স থেকে আসা ফরম্যাট পার্স করে একই স্ট্যান্ডার্ড ফরম্যাটে দেখানো হয়
                            const parsedDate = parseDateString(rawCellData);
                            cell.textContent = parsedDate ? formatDateForDisplay(parsedDate) : (cellData || '—');
                            if (!parsedDate && cellData) {
                                cell.title = 'তারিখের ফরম্যাট চেনা যায়নি, মূল মান দেখানো হচ্ছে';
                            }
                        }
                        else {
                            cell.textContent = cellData;
                        }
                    });
                });
                loadingMessage.style.display = 'none';
                dataTable.style.display = 'table';
            }

            // --- ডেটা সিঙ্ক: fetch() দিয়ে প্রতি ১৫ সেকেন্ডে পোলিং (EventSource/SSE ছাড়া) ---
            let firebaseDataMap = {}; // Firebase key -> row object, লোকাল মিরর
            const POLL_INTERVAL_MS = 15000; // ১৫ সেকেন্ড
            let pollTimer = null;
            let isFetching = false;
            let hasLoadedOnce = false;

            function rebuildOriginalDataFromMap() {
                const items = Object.keys(firebaseDataMap).map(key => ({
                    originalIndex: key,
                    data: rowObjectToArray(firebaseDataMap[key])
                }));
                originalData = items;
                originalData.sort(customSort);
            }

            function refreshUIFromLocalData(isInitialLoad) {
                rebuildOriginalDataFromMap();
                if (isInitialLoad) {
                    populateCategoryFilter(originalData);
                    populateStatusFilter();
                    renderTableBody(originalData);
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('invoiceDataTable').style.display = 'table';
                } else {
                    const categorySelect = document.getElementById('categoryFilter');
                    const currentCategoryValue = categorySelect ? categorySelect.value : '';
                    populateCategoryFilter(originalData);
                    if (categorySelect) categorySelect.value = currentCategoryValue;
                    filterTable();
                }
            }

            async function fetchDataOnce() {
                // কোনো ড্রপডাউন এডিট/সেভ চলাকালীন বা আগের ফেচ শেষ না হলে স্কিপ করা হবে,
                // যাতে ইউজারের কাজের মাঝখানে টেবিল রিফ্রেশ হয়ে বিঘ্ন না ঘটায়
                if (isFetching || document.querySelector('.editable-cell select:disabled')) {
                    return;
                }
                isFetching = true;
                try {
                    const response = await fetch(firebaseUrl(''));
                    if (!response.ok) {
                        throw new Error('HTTP ' + response.status);
                    }
                    const data = await response.json();
                    firebaseDataMap = data || {};
                    refreshUIFromLocalData(!hasLoadedOnce);
                    hasLoadedOnce = true;
                } catch (err) {
                    console.error('ডেটা ফেচ করতে সমস্যা হয়েছে:', err);
                    if (!hasLoadedOnce) {
                        handleError({ message: 'ডেটা লোড করা যায়নি। ইন্টারনেট সংযোগ চেক করুন।' });
                    }
                    // পরবর্তী চক্রে আবার চেষ্টা হবে, ততক্ষণ বিদ্যমান ডেটা দেখানো থাকবে
                } finally {
                    isFetching = false;
                }
            }

            function startAutoRefresh() {
                if (pollTimer) clearInterval(pollTimer);
                pollTimer = setInterval(fetchDataOnce, POLL_INTERVAL_MS);
            }

            // ট্যাব ব্যাকগ্রাউন্ডে গেলে পোলিং বন্ধ, সামনে ফিরলে সাথে সাথে রিফ্রেশ করে আবার শুরু (রিসোর্স সাশ্রয়ের জন্য)
            document.addEventListener('visibilitychange', function() {
                if (document.hidden) {
                    if (pollTimer) {
                        clearInterval(pollTimer);
                        pollTimer = null;
                    }
                } else {
                    fetchDataOnce();
                    startAutoRefresh();
                }
            });

            async function handleDropdownChange(event) {
                const changedSelect = event.target;
                const originalRowIndex = changedSelect.dataset.originalRowIndex; // firebase key (string)
                const originalColIndex = parseInt(changedSelect.dataset.originalColIndex);
                const newValue = changedSelect.value.trim();
                const originalRowItem = originalData.find(item => item.originalIndex === originalRowIndex);
                
                if (!originalRowItem) {
                    showStatusMessage('ত্রুটি: ডেটা রো খুঁজে পাওয়া যায়নি।', true);
                    return;
                }
                
                const originalValueInLocalData = originalRowItem.data[originalColIndex];
                const trimmedLowercasedOriginalValue = String(originalValueInLocalData || '').trim().toLowerCase();
                const trimmedLowercasedNewValue = newValue.toLowerCase();

                if (trimmedLowercasedOriginalValue !== trimmedLowercasedNewValue) {
                    changedSelect.disabled = true;
                    const fieldName = columnFields[originalColIndex];

                    try {
                        const response = await fetch(firebaseUrl(originalRowIndex), {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ [fieldName]: newValue })
                        });
                        if (!response.ok) {
                            throw new Error('HTTP ' + response.status);
                        }
                        showStatusMessage('ডেটা সফলভাবে আপডেট করা হয়েছে।', false);
                        originalRowItem.data[originalColIndex] = newValue;
                        // লোকাল মিরর-ও সিঙ্কে রাখা হচ্ছে যাতে পরবর্তী রিফ্রেশে পুরনো মান দেখা না যায়
                        if (firebaseDataMap[originalRowIndex]) {
                            firebaseDataMap[originalRowIndex][fieldName] = newValue;
                        }
                        originalData.sort(customSort);
                        filterTable();
                    } catch (error) {
                        showStatusMessage(`আপডেট করতে সমস্যা হয়েছে: ${error.message}. Console চেক করুন।`, true);
                        changedSelect.value = originalValueInLocalData;
                    } finally {
                        changedSelect.disabled = false;
                    }
                }
            }

            function handleError(error) {
                const loadingMessage = document.getElementById('loading');
                loadingMessage.textContent = 'ডেটা লোড করতে সমস্যা হয়েছে: ' + error.message;
                loadingMessage.style.color = 'red';
                document.getElementById('invoiceDataTable').style.display = 'none';
            }
            
            function filterTable() {
                const filters = {};
                document.querySelectorAll('.filter-input, .filter-dropdown').forEach(element => {
                    const originalColIndex = element.dataset.column;
                    let value = element.value.trim();
                    if (value && value !== 'All Categories' && value !== 'All Status') {
                        filters[originalColIndex] = value;
                    }
                });

                const filteredData = originalData.filter(item => {
                    const rowData = item.data;
                    let isMatch = true;

                    for (const colIndex in filters) {
                        const filterValue = filters[colIndex];
                        const rawCellValue = rowData[colIndex];
                        const cellValue = String(rawCellValue || '').trim();
                        const colIndexInt = parseInt(colIndex);

                        if (filterValue === 'BLANK_VALUE_FILTER') {
                            if (colIndexInt === 10 && cellValue !== '') {
                                isMatch = false;
                                break;
                            }
                        } else if (colIndexInt === 10 || colIndexInt === 5) { 
                            if (cellValue.toLowerCase() !== filterValue.toLowerCase()) {
                                isMatch = false;
                                break;
                            }
                        } else { 
                            if (cellValue.toLowerCase().indexOf(filterValue.toLowerCase()) === -1) {
                                isMatch = false;
                                break;
                            }
                        }
                    }
                    return isMatch;
                });
                renderTableBody(filteredData);
            }

            function toggleFilterPanel() {
                const panel = document.getElementById('filterPanel');
                const icon = document.getElementById('filterToggleIcon');
                panel.classList.toggle('open');
                icon.textContent = panel.classList.contains('open') ? '▲' : '▼';
            }

            function clearAllFilters() {
                document.querySelectorAll('.filter-input').forEach(input => { input.value = ''; });
                document.querySelectorAll('.filter-dropdown').forEach(select => { select.value = ''; });
                filterTable();
            }

            window.onload = function() {
                fetchDataOnce();
                startAutoRefresh();

                const filterInputs = document.querySelectorAll('.filter-input');
                filterInputs.forEach(input => {
                    input.addEventListener('keyup', filterTable);
                });
            };
        </script>
    </div>
</body>
</html>
